<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180" role="img" aria-labelledby="title description">
  <title id="title">OpenBrivo</title>
  <desc id="description">An open padlock with a Bluetooth signal beside the OpenBrivo wordmark.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0f2438"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#020617" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect x="12" y="12" width="696" height="156" rx="34" fill="url(#panel)" filter="url(#shadow)"/>
  <rect x="13" y="13" width="694" height="154" rx="33" fill="none" stroke="#334155" stroke-width="2"/>

  <g transform="translate(43 30)">
    <rect width="120" height="120" rx="30" fill="#0b3342"/>
    <path d="M38 59V44c0-19 13-32 30-32s30 13 30 32v2" fill="none" stroke="url(#accent)" stroke-width="10" stroke-linecap="round"/>
    <rect x="25" y="55" width="70" height="52" rx="14" fill="url(#accent)"/>
    <path d="M60 69v22m0-22 14 11-14 11m0-22L48 80m12 11L48 80" fill="none" stroke="#083344" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="193" y="91" fill="#f8fafc" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="56" font-weight="750" letter-spacing="-2">Open<tspan fill="#5eead4">Brivo</tspan></text>
  <text x="196" y="125" fill="#94a3b8" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="500" letter-spacing="2.8">LOCAL · SECURE · BLUETOOTH</text>
</svg>
